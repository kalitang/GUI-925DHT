<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <filter id="g" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>
  <!-- shadow -->
  <ellipse cx="32" cy="58" rx="12" ry="2" fill="rgba(0,0,0,0.35)"/>
  <!-- pole -->
  <rect x="30" y="22" width="4" height="32" fill="#6b4423"/>
  <!-- cross arm -->
  <rect x="14" y="20" width="36" height="4" fill="#6b4423"/>
  <!-- insulators -->
  <circle cx="18" cy="22" r="2.5" fill="#e8e8e8"/>
  <circle cx="32" cy="22" r="2.5" fill="#e8e8e8"/>
  <circle cx="46" cy="22" r="2.5" fill="#e8e8e8"/>
  <!-- transformer (red drum) -->
  <ellipse cx="32" cy="38" rx="11" ry="9" fill="#c0392b" stroke="#7b241c" stroke-width="1.5"/>
  <rect x="21" y="34" width="22" height="8" fill="none" stroke="#7b241c" stroke-width="1"/>
  <!-- cooling fins -->
  <line x1="24" y1="34" x2="24" y2="42" stroke="#7b241c" stroke-width="0.8"/>
  <line x1="27" y1="34" x2="27" y2="42" stroke="#7b241c" stroke-width="0.8"/>
  <line x1="37" y1="34" x2="37" y2="42" stroke="#7b241c" stroke-width="0.8"/>
  <line x1="40" y1="34" x2="40" y2="42" stroke="#7b241c" stroke-width="0.8"/>
  <!-- T label -->
  <text x="32" y="42" font-family="Arial,sans-serif" font-weight="bold" font-size="10" fill="#fff" text-anchor="middle">T</text>
</svg>