<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- B 类：杆塔（40cm 直径、20m 高的水泥柱）— 俯视正圆，灰色填充 + 深灰边框 -->
  <!-- 灰色圆形（俯视）：水泥柱在地面看就是一个圆盘 -->
  <circle cx="32" cy="32" r="26" fill="#9E9E9E" fill-opacity="0.85" stroke="#424242" stroke-width="3"/>
  <!-- 内部同心圆（强调"柱"结构） -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#424242" stroke-width="1.5" stroke-opacity="0.7"/>
  <!-- 中心定位点 -->
  <circle cx="32" cy="32" r="3" fill="#212121"/>
</svg>